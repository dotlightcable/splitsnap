<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SplitSnap — your money agent</title>
<style>
  :root {
    --ink: #101613; --paper: #f7f3e8; --accent: #00c46a; --accent-deep: #009b54;
    --gold: #ffb62e; --rose: #ff5d73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--paper);
    background: radial-gradient(1200px 600px at 80% -10%, #16402c 0%, transparent 60%),
                radial-gradient(900px 500px at 10% 10%, #243b2c 0%, transparent 55%),
                #0c100d;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .wrap { max-width: 560px; margin: 0 auto; width: 100%; padding: 16px 14px calc(90px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 12px; }
  .logo { font-weight: 800; font-size: 1.35rem; letter-spacing: -.5px; }
  .logo span { color: var(--accent); }
  .logo small { display: block; font-size: .68rem; font-weight: 600; color: #8b9187; letter-spacing: 2px; }
  .mode { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    padding: .35rem .8rem; border-radius: 999px; background: rgba(255,182,46,.15);
    color: var(--gold); border: 1px solid rgba(255,182,46,.4); white-space: nowrap; }
  .mode.live { background: rgba(0,196,106,.15); color: var(--accent); border-color: rgba(0,196,106,.4); }
  #thread { display: flex; flex-direction: column; gap: 10px; padding: 6px 2px; }
  .msg { max-width: 88%; padding: .7rem .95rem; border-radius: 18px; font-size: .95rem; line-height: 1.5;
    animation: pop .25s ease; white-space: pre-line; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }
  .bot { align-self: flex-start; background: #182019; border: 1px solid #263027; border-bottom-left-radius: 6px; }
  .user { align-self: flex-end; background: linear-gradient(135deg, var(--accent-deep), var(--accent));
    color: #06110b; font-weight: 600; border-bottom-right-radius: 6px; }
  .typing { color: #8b9187; font-size: .85rem; align-self: flex-start; padding: 0 4px; }
  .billcard { align-self: stretch; background: var(--paper); color: var(--ink); border-radius: 6px;
    padding: 16px 16px 24px; position: relative; animation: pop .3s ease; margin-top: 2px; }
  .billcard::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 11px;
    background: linear-gradient(-45deg, transparent 8px, var(--paper) 0) 0 0 / 16px 16px repeat-x,
                linear-gradient(45deg, transparent 8px, var(--paper) 0) 8px 0 / 16px 16px repeat-x;
    transform: rotate(180deg); }
  .billcard h3 { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; letter-spacing: 3px;
    text-align: center; margin: 0 0 10px; }
  .brow { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-family: ui-monospace, Menlo, monospace; font-size: .85rem; padding: .5rem 0;
    border-bottom: 1px dashed #cfc8b4; }
  .brow.paid { opacity: .55; }
  .bwho { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bamt { font-weight: 800; white-space: nowrap; }
  .tick { color: var(--accent-deep); font-weight: 800; }
  .bstats { display: flex; gap: 12px; justify-content: center; font-size: .78rem; color: #6d7269;
    margin-top: 10px; font-family: ui-monospace, Menlo, monospace; }
  .nudgecard { align-self: stretch; background: #fff8e6; border: 1.5px dashed var(--gold);
    border-radius: 12px; padding: .8rem .95rem; color: var(--ink); font-size: .88rem;
    animation: pop .3s ease; }
  .nudgecard button { margin-top: .6rem; width: 100%; padding: .6rem; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--ink); background: transparent; font-weight: 800; color: var(--ink); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 2px 0; }
  .chip { font-size: .8rem; font-weight: 700; padding: .5rem .85rem; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--accent); border: 1.5px solid rgba(0,196,106,.5); }
  .chip:active { background: rgba(0,196,106,.15); }
  .composer { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(12,16,13,.92); backdrop-filter: blur(8px); border-top: 1px solid #222b23; }
  .composer .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  .composer textarea { flex: 1; border-radius: 14px; border: 1.5px solid #2c352d; background: #141a15;
    color: var(--paper); font-size: 1rem; padding: .7rem .9rem; resize: none; font-family: inherit; }
  .composer textarea:focus { outline: 2px solid var(--accent); }
  .composer button.sendbtn { border: none; border-radius: 14px; padding: 0 1.2rem; font-size: 1.1rem; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #5cf2a6); color: #06110b; font-weight: 800; }
  .composer button.toolbtn { border: 1.5px solid #2c352d; border-radius: 14px; padding: 0 .8rem; font-size: 1.15rem;
    cursor: pointer; background: #141a15; color: var(--paper); }
  .composer button.toolbtn.listening { border-color: var(--rose); color: var(--rose); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .speaker { border: 1.5px solid #2c352d; border-radius: 999px; background: transparent; color: var(--paper);
    font-size: .95rem; padding: .3rem .6rem; cursor: pointer; }
  .speaker.on { border-color: var(--accent); }
  footer { text-align: center; color: #5c615a; font-size: .72rem; padding: 14px 0 4px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Split<span>Snap</span><small>YOUR MONEY AGENT</small></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="speaker" id="spk" onclick="toggleSpeak()" title="Voice replies">🔇</button>
      <div class="mode" id="mode">…</div>
    </div>
  </header>
  <div id="thread"></div>
  <div class="chips" id="chips"></div>
  <footer>SplitSnap · PayPal AI Hackathon '26 · live PayPal sandbox</footer>
</div>
<div class="composer"><div class="inner">
  <button class="toolbtn" id="mic" onclick="micListen()" title="Talk">🎤</button>
  <button class="toolbtn" onclick="document.getElementById('scan').click()" title="Scan receipt">📷</button>
  <input type="file" id="scan" accept="image/*" style="display:none" onchange="scanFile(this)">
  <textarea id="box" rows="1" placeholder="Tell Snap what to do with money…"></textarea>
  <button class="sendbtn" onclick="send()">↑</button>
</div></div>

<script>
const thread = document.getElementById('thread');
const box = document.getElementById('box');
fetch('/api/status').then(r => r.json()).then(s => {
  const m = document.getElementById('mode');
  m.textContent = s.mode === 'live-sandbox' ? '● live sandbox' : '● mock mode';
  if (s.mode === 'live-sandbox') m.classList.add('live');
});
function bubble(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who; d.textContent = text;
  thread.appendChild(d); window.scrollTo(0, document.body.scrollHeight);
  return d;
}
function billCard(b) {
  const d = document.createElement('div');
  d.className = 'billcard';
  d.innerHTML = '<h3>★ LIVE BILL ★</h3>' + b.requests.map(r =>
    '<div class="brow' + (r.paid ? ' paid' : '') + '"><span class="bwho">' +
    (r.paid ? '<span class="tick">✓ </span>' : '') + esc(r.email) +
    '</span><span class="bamt">$' + r.amount + '</span></div>'
  ).join('') +
  '<div class="bstats"><span>total $' + b.total + '</span><span>collected $' + b.collected +
  '</span><span>owed $' + b.owed + '</span></div>';
  thread.appendChild(d); window.scrollTo(0, document.body.scrollHeight);
}
function nudgeCard(n) {
  const d = document.createElement('div');
  d.className = 'nudgecard';
  const safe = esc(n);
  d.innerHTML = safe.replace(/\n/g, '<br>') + '<br><button>Copy nudge-text</button>';
  d.querySelector('button').onclick = (e) => {
    navigator.clipboard.writeText(n).then(() => e.target.textContent = 'Copied ✓');
  };
  thread.appendChild(d); window.scrollTo(0, document.body.scrollHeight);
}
function setChips(list) {
  const c = document.getElementById('chips');
  c.innerHTML = '';
  list.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = t;
    b.onclick = () => { box.value = t; send(); };
    c.appendChild(b);
  });
}
async function send() {
  const text = box.value.trim();
  if (!text) return;
  box.value = '';
  bubble(text, 'user');
  const tp = document.createElement('div');
  tp.className = 'typing'; tp.textContent = 'Snap is on it…';
  thread.appendChild(tp);
  try {
    const res = await (await fetch('/api/agent', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: text })
    })).json();
    tp.remove();
    bubble(res.reply, 'bot');
    speak(res.reply);
    if (res.bill && res.bill.requests.length) billCard(res.bill);
    if (res.nudge) nudgeCard(res.nudge);
  } catch (e) {
    tp.remove();
    bubble('Connection hiccup — try again 🙃', 'bot');
  }
  window.scrollTo(0, document.body.scrollHeight);
}
box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
// ---------- voice in ----------
function micListen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { bubble('Voice input needs Chrome or Safari 🎤', 'bot'); return; }
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false;
  const btn = document.getElementById('mic');
  btn.classList.add('listening');
  rec.onresult = (e) => {
    box.value = e.results[0][0].transcript;
    btn.classList.remove('listening');
    send();
  };
  rec.onerror = rec.onend = () => btn.classList.remove('listening');
  rec.start();
}
// ---------- voice out ----------
let voiceOn = false;
function toggleSpeak() {
  voiceOn = !voiceOn;
  const b = document.getElementById('spk');
  b.textContent = voiceOn ? '🔊' : '🔇';
  b.classList.toggle('on', voiceOn);
  if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
}
function speak(text) {
  if (!voiceOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text.slice(0, 280)));
}
// ---------- receipt scan ----------
async function scanFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!window.Tesseract) { bubble('Scanner is still loading — try again in a few seconds 📷', 'bot'); return; }
  bubble('📷 ' + file.name, 'user');
  const tp = document.createElement('div');
  tp.className = 'typing'; tp.textContent = 'Reading receipt…';
  thread.appendChild(tp);
  try {
    const { data } = await Tesseract.recognize(file, 'eng');
    tp.remove();
    const lines = data.text.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) { bubble("Couldn't read anything — try a clearer shot 📷", 'bot'); return; }
    box.value = lines.join('\n');
    send();
  } catch (e) {
    tp.remove();
    bubble("Scan failed — type the lines instead, or retry 📷", 'bot');
  }
}
bubble("Hey, I'm Snap 👋 Your money agent.\nGive me a bill and a crew — I'll split it, send the PayPal requests, and chase anyone who ghosts.", 'bot');
setChips(['Split $64 between ana@x.com and ben@x.com', "Who hasn't paid?", 'Remind everyone', 'Start over']);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
